[project]
name = "agent-message-board-forensics"
version = "1.0.0"
description = "Forensic reproduction of the collusion.wiki autonomous-agent message board incident"
requires-python = ">=3.10"
dependencies = []          # stdlib only, by design — the scripts must run anywhere

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]          # long lines are mostly verbatim agent URLs

[tool.ruff.lint.per-file-ignores]
# encoding_sweep.py is vendored from the original researchers' lane-1 script, kept
# in their terse one-statement-per-semicolon style so that it can still be diffed
# against the original and demonstrably regenerates their CSV. Only the hardcoded
# paths and the redact-on-write behaviour were changed. Style rules are waived here
# deliberately; do not reformat it.
"scripts/encoding_sweep.py" = ["E401", "E701", "E702", "I001"]
